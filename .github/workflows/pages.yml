name: Тесты, сборка и публикация на GitHub Pages

# Тесты и сборка идут на каждый push. Публикуется основная ветка репозитория, а при ручном
# запуске (Run workflow) — выбранная ветка. Какие ветки вправе публиковать, решает окружение
# github-pages: Settings → Environments → github-pages → Deployment branches.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Передать сборку на публикацию
        if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Публикации не обгоняют друг друга: новая ждёт, пока закончится текущая
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
